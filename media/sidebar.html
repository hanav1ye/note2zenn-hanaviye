<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="__CSP__" />
  <style>
    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      color: var(--vscode-foreground);
      padding: 12px;
      line-height: 1.4;
    }
    h2 {
      font-size: 1em;
      margin: 16px 0 8px;
      font-weight: 600;
    }
    h2:first-child { margin-top: 0; }
    label {
      display: block;
      margin: 8px 0 4px;
      font-size: 0.9em;
      opacity: 0.9;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--vscode-input-background);
      color: var(--vscode-input-foreground);
      border: 1px solid var(--vscode-input-border, transparent);
      padding: 6px 8px;
      border-radius: 2px;
    }
    textarea { min-height: 120px; font-family: var(--vscode-editor-font-family); font-size: 0.85em; }
    button {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      border: none;
      border-radius: 2px;
      cursor: pointer;
    }
    button.secondary {
      background: var(--vscode-button-secondaryBackground);
      color: var(--vscode-button-secondaryForeground);
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .row { display: flex; gap: 6px; }
    .row button { flex: 1; }
    .hint { font-size: 0.85em; opacity: 0.85; margin: 0 0 8px; }
    .status { font-size: 0.85em; margin: 4px 0 8px; }
    .ok { color: var(--vscode-testing-iconPassed, #89d185); }
    .ng { color: var(--vscode-errorForeground); }
    .field-error {
      font-size: 0.85em;
      color: var(--vscode-errorForeground);
      margin: 4px 0 8px;
      min-height: 1.2em;
    }
    #log {
      margin-top: 12px;
      padding: 8px;
      background: var(--vscode-textCodeBlock-background);
      font-size: 0.8em;
      white-space: pre-wrap;
      min-height: 2em;
    }
    .slider-block {
      margin: 10px 0 12px;
      padding: 8px;
      border: 1px solid var(--vscode-input-border, transparent);
      border-radius: 4px;
      background: var(--vscode-input-background);
    }
    .slider-row {
      margin-bottom: 10px;
    }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
      font-size: 0.9em;
    }
    .slider-value {
      font-variant-numeric: tabular-nums;
      opacity: 0.85;
    }
    input[type="range"] {
      width: 100%;
      padding: 0;
      height: 20px;
      accent-color: var(--vscode-focusBorder, #007fd4);
    }
    #freeInstruction {
      min-height: 64px;
    }
  </style>
</head>
<body>
  <h2>変換</h2>
  <label for="noteUrl">note URL</label>
  <input id="noteUrl" type="url" placeholder="https://note.com/..." />
  <label for="basename">basename</label>
  <input id="basename" type="text" placeholder="articles/images のベース名" />
  <button id="runBtn">変換を実行</button>

  <h2>設定</h2>
  <label for="zennRepoPath">Zenn リポジトリパス</label>
  <input id="zennRepoPath" type="text" />
  <label for="openAiModel">OpenAI モデル</label>
  <input id="openAiModel" type="text" />
  <label for="defaultBasename">既定 basename（任意）</label>
  <input id="defaultBasename" type="text" />
  <p class="hint">文体は 0.0〜1.0 のスライダーで調整します（そのまま変換に反映）。</p>
  <div class="slider-block">
    <div class="slider-row">
      <div class="slider-label">
        <span>論理的・結論優先</span>
        <span class="slider-value" id="logical_densityVal">0.50</span>
      </div>
      <input type="range" id="logical_density" min="0" max="100" step="1" value="50" data-axis="logical_density" />
    </div>
    <div class="slider-row">
      <div class="slider-label">
        <span>技術用語やコード解説</span>
        <span class="slider-value" id="technical_focusVal">0.50</span>
      </div>
      <input type="range" id="technical_focus" min="0" max="100" step="1" value="50" data-axis="technical_focus" />
    </div>
    <div class="slider-row">
      <div class="slider-label">
        <span>感想・情緒</span>
        <span class="slider-value" id="emotional_retentionVal">0.50</span>
      </div>
      <input type="range" id="emotional_retention" min="0" max="100" step="1" value="50" data-axis="emotional_retention" />
    </div>
    <div class="slider-row">
      <div class="slider-label">
        <span>丁寧さ（です・ます）</span>
        <span class="slider-value" id="politeness_levelVal">0.50</span>
      </div>
      <input type="range" id="politeness_level" min="0" max="100" step="1" value="50" data-axis="politeness_level" />
    </div>
  </div>
  <label for="freeInstruction">追加指示（free_instruction・任意）</label>
  <textarea id="freeInstruction" placeholder="例: 見出しは短く、コード例は省略しない"></textarea>

  <h2>秘密情報</h2>
  <p class="hint">4 つすべて「設定済み」になるまで変換できません。</p>
  <div class="status" id="secretOpenAi"></div>
  <div class="status" id="secretGithub"></div>
  <div class="status" id="secretGitName"></div>
  <div class="status" id="secretGitEmail"></div>
  <div class="row">
    <button class="secondary" data-secret="openAiApiKey">OpenAI Key</button>
    <button class="secondary" data-secret="githubToken">GitHub Token</button>
  </div>
  <div class="row">
    <button class="secondary" data-secret="gitAuthorName">Git 名前</button>
    <button class="secondary" data-secret="gitAuthorEmail">Git メール</button>
  </div>
  <div id="secretsError" class="field-error" role="alert"></div>

  <div id="log"></div>

  <script src="__SCRIPT_URI__"></script>
</body>
</html>
